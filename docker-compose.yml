services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kivi
    ports:
      # Host port 5433, not 5432 — avoids colliding with a local Postgres already
      # running on the host. The app always talks to the db service on 5432
      # over the internal Docker network, so this only affects host-side psql access.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kivi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
